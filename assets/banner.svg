<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Caleb Boakye Yiadom</title>
  <desc id="d">Freelance developer in Ghana. Full-stack web, mobile apps and security tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#F2B33D" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F2B33D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#24314D"/>
    </pattern>
    <radialGradient id="fade" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- Identity -->
    <text x="72" y="104" class="mono" font-size="16" letter-spacing="3" fill="#F2B33D">FREELANCE DEVELOPER · GHANA</text>
    <text x="70" y="172" class="sans" font-size="62" font-weight="700" fill="#F5F7FA" letter-spacing="-1">Caleb Boakye Yiadom</text>
    <text x="72" y="216" class="sans" font-size="25" fill="#9AA6B8">Full-stack web  ·  Mobile apps  ·  Security tools</text>

    <!-- Ghana stripe -->
    <rect x="72" y="244" width="30" height="5" rx="2.5" fill="#CE1126"/>
    <rect x="108" y="244" width="30" height="5" rx="2.5" fill="#FCD116"/>
    <rect x="144" y="244" width="30" height="5" rx="2.5" fill="#006B3F"/>

    <!-- Terminal card -->
    <g transform="translate(828 62)">
      <rect width="300" height="176" rx="12" fill="#0E1626" stroke="#22304A"/>
      <circle cx="22" cy="20" r="5" fill="#FF5F57"/>
      <circle cx="40" cy="20" r="5" fill="#FEBC2E"/>
      <circle cx="58" cy="20" r="5" fill="#28C840"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#1B2740"/>
      <g class="mono" font-size="16">
        <text x="22" y="72"><tspan fill="#F2B33D">$</tspan><tspan fill="#C9D1D9"> caleb --services</tspan></text>
        <text x="22" y="102"><tspan fill="#3FB950">✓</tspan><tspan fill="#C9D1D9"> web apps</tspan></text>
        <text x="22" y="128"><tspan fill="#3FB950">✓</tspan><tspan fill="#C9D1D9"> mobile apps</tspan></text>
        <text x="22" y="154"><tspan fill="#3FB950">✓</tspan><tspan fill="#C9D1D9"> security audits</tspan></text>
      </g>
      <rect class="cursor" x="194" y="140" width="9" height="18" fill="#F2B33D"/>
    </g>
  </g>
</svg>
